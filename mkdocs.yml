site_name: EOPF xarray backend
repo_url: https://github.com/EOPF-Sample-Service/xarray-eopf
repo_name: EOPF-Sample-Service/xarray-eopf

copyright: Copyright &copy; 2026 EOPF Sample Service Team

nav:
  - Overview: index.md
  - Getting Started: start.md
  - User Guide: guide.md
  - Example Notebooks:
      - Introduction: examples/introduction.ipynb
      - Sentinel-1 Native Mode: examples/sentinel_1_native.ipynb
      - Sentinel-1 Analysis Mode: examples/sentinel_1_analysis.ipynb
      - Sentinel-2 Native Mode: examples/sentinel_2_native.ipynb
      - Sentinel-2 Analysis Mode: examples/sentinel_2_analysis.ipynb
      - Sentinel-3 Native Mode: examples/sentinel_3_native.ipynb
      - Sentinel-3 Analysis Mode: examples/sentinel_3_analysis.ipynb
  - Python API: api.md
  - About: about.md

theme:
  name: material
  font: false
  custom_dir: docs/overrides

hooks:
  - docs/hooks/download_fonts.py

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/EOPF-Sample-Service/xarray-eopf
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/xarray-eopf/
  footer_links:
    - text: Imprint
      href: https://www.brockmann-consult.de/imprint/
    - text: Privacy Policy
      href: https://www.brockmann-consult.de/privacy-policy-documentation-pages/

extra_css:
  - stylesheets/xarray_dataset.css
  - stylesheet/extra.css

plugins:
  - search
  - mkdocs-jupyter
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_toc_entry: true
            show_root_heading: true
            show_source: true
            heading_level: 2
            annotations_path: brief
            members_order: source
